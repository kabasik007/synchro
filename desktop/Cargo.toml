[package]
name = "synchro-desktop"
version = "0.2.0"
edition = "2024"
description = "Synchro Rust desktop sender for Android"
license = "MIT"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15.4"
