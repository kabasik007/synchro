[package]
name = "synchro-server"
version = "0.5.1"
edition = "2021"
description = "Synchro Internet Mode - owner-controlled relay for Windows and Android"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
fs2 = "0.4"
subtle = "2"
futures-util = "0.3"
percent-encoding = "2.3"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
