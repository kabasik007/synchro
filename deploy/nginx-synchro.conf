# Synchro v0.4.2 Nginx snippet for aaPanel.
# Include INSIDE the HTTPS server { ... } block for YOUR_DOMAIN.
# Ensure the aaPanel site root is /www/wwwroot/YOUR_DOMAIN.
# Keep existing SSL certificate, ACME and redirect sections untouched.
# Run nginx -t before reload. This file is NOT an entire vhost.

# REQUIRED: first include deploy/nginx-http-limits.conf inside nginx http{}.
# Without those limit zones nginx -t will reject this server snippet.
client_max_body_size 10m;
limit_req_status 429;

# Do not log URLs from private API sessions. Tokens must be supplied by
# Authorization headers, never query strings.
location ^~ /api/v1/ {
    access_log off;
    limit_req zone=synchro_api burst=24 nodelay;
    limit_conn synchro_connections 10;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 5s;
    add_header Cache-Control "no-store" always;
}

location = /ws {
    access_log off;
    limit_req zone=synchro_ws burst=4 nodelay;
    limit_conn synchro_connections 3;
    proxy_pass http://127.0.0.1:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /health {
    access_log off;
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
}

location = /install {
    return 308 /install/;
}

# Block accidentally deployed secrets and backups (even if a file is placed in webroot).
location ~ /\.(?!well-known/) { return 403; }
location ~* \.(?:sql|sqlite|sqlite3|db|bak|old|env|zip|tar|tgz)$ { return 403; }

location / {
    disable_symlinks on;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://$host; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

