# Synchro global request limits. Include ONCE inside nginx's `http { ... }` context,
# BEFORE any `server {}` using deploy/nginx-synchro.conf.
# aaPanel: typically /www/server/nginx/conf/nginx.conf -> http { ... }.
# Use Nginx's TRUSTED real_ip configuration when proxied through Cloudflare.
# Never trust arbitrary X-Forwarded-For values from the open Internet.
limit_req_zone $binary_remote_addr zone=synchro_api:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=synchro_ws:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=synchro_connections:10m;
